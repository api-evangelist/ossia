aid: ossia
name: Ossia
description: 'Ossia, Inc. is a Redmond, Washington wireless power technology company
  founded by physicist Hatem Zeine (incorporated as Omnilectric in 2008, operating as
  Ossia from 2013) and the inventor of Cota Real Wireless Power — a patented RF smart-antenna
  system that delivers targeted energy over the air to multiple moving devices at a distance,
  without pads, plugs, cables or line of sight. A Cota receiver emits a beacon and the Cota
  transmitter returns a focused 2.4 GHz or 5.8 GHz power signal along the same path, which
  is how the system tracks and powers devices in motion. Ossia does not manufacture products
  for sale: it licenses the Cota technology to manufacturers, brands and OEMs, ships Cota
  developer and reference design kits (receiver chip, sample hardware, software components,
  test instructions) to authorized licensees, and works through joint ventures and development
  partners such as Motherson Ossia. The company holds 180+ US and international patents, is
  FCC certified under Parts 15 and 18, and carries regulatory approval in the US, UK and 45+
  other countries. Ossia publishes no public API, developer portal, SDK or machine-readable
  contract of any kind — the developer surface it does have is hardware and firmware delivered
  under license.'
